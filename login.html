<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký - LEGION STORE</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0f172a 100%);
      margin: 0;
      padding: 1.5rem;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem 2rem;
      border-radius: 20px;
    }
    .auth-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }
    .auth-subtitle {
      color: var(--text-secondary);
      text-align: center;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 1.5rem;
    }
    .auth-tab {
      flex: 1;
      padding: 0.75rem;
      text-align: center;
      cursor: pointer;
      color: var(--text-secondary);
      font-weight: 600;
      transition: all 0.3s ease;
      border-bottom: 2px solid transparent;
    }
    .auth-tab.active {
      color: var(--accent-primary);
      border-bottom: 2px solid var(--accent-primary);
    }
  </style>
</head>
<body>

  <div class="glass-panel auth-container">
    <div class="auth-title">LEGION <span style="color: var(--accent-primary);">STORE</span></div>
    <div class="auth-subtitle">Cổng đăng nhập hệ thống mua hàng tự động</div>

    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login-btn">Đăng Nhập</div>
      <div class="auth-tab" id="tab-register-btn">Đăng Ký</div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label">Địa chỉ Email</label>
        <input type="email" id="login-email" class="form-control" placeholder="email@cua-ban.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 1.5rem;">
        Đăng Nhập
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="d-none">
      <div class="form-group">
        <label class="form-label">Địa chỉ Email</label>
        <input type="email" id="register-email" class="form-control" placeholder="email@cua-ban.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu (tối thiểu 6 ký tự)</label>
        <input type="password" id="register-password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>
      <div class="form-group">
        <label class="form-label">Xác nhận mật khẩu</label>
        <input type="password" id="register-confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>
      <button type="submit" id="register-submit" class="btn btn-success" style="width: 100%; justify-content: center; padding: 0.75rem; margin-top: 1.5rem;">
        Đăng Ký Tài Khoản
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem;">
      <a href="/" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; transition: color 0.3s;" onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-secondary)'">← Quay lại Cửa hàng</a>
    </div>
  </div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
  <script>
    
window.showToast = function(message, type = 'info') {
  let container = document.getElementById('toast-container');
  if (!container) {
    container = document.createElement('div');
    container.id = 'toast-container';
    container.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; max-width: 350px; width: calc(100% - 40px);';
    document.body.appendChild(container);
  }

  const card = document.createElement('div');
  card.className = `toast-card toast-${type}`;
  card.innerHTML = `
    <span>${message}</span>
    <button class="toast-close">&times;</button>
  `;

  const closeBtn = card.querySelector('.toast-close');
  const closeToast = () => {
    card.style.animation = 'toastSlideOut 0.3s ease forwards';
    setTimeout(() => { card.remove(); }, 300);
  };
  closeBtn.onclick = closeToast;

  setTimeout(closeToast, 4000);
  container.appendChild(card);
};
\nconst { createClient } = supabase;
    const supabaseClient = createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);

    const tabLoginBtn = document.getElementById('tab-login-btn');
    const tabRegisterBtn = document.getElementById('tab-register-btn');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    // Tab Switching
    tabLoginBtn.onclick = () => {
      tabLoginBtn.classList.add('active');
      tabRegisterBtn.classList.remove('active');
      loginForm.classList.remove('d-none');
      registerForm.classList.add('d-none');
    };

    tabRegisterBtn.onclick = () => {
      tabRegisterBtn.classList.add('active');
      tabLoginBtn.classList.remove('active');
      registerForm.classList.remove('d-none');
      loginForm.classList.add('d-none');
    };

    // Handle Login
    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const submitBtn = document.getElementById('login-submit');

      submitBtn.disabled = true;
      submitBtn.innerText = 'Đang đăng nhập...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        // Check if admin to redirect
        const { data: profile, error: profError } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        if (!profError && profile && profile.role === 'admin') {
          location.href = '/admin';
        } else {
          location.href = '/';
        }
      } catch (err) {
        showToast('Đăng nhập thất bại: ' + (err.message || 'Sai tài khoản hoặc mật khẩu.'), 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Đăng Nhập';
      }
    };

    // Handle Register
    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('register-email').value.trim();
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('register-confirm-password').value;
      const submitBtn = document.getElementById('register-submit');

      // 1. Password Confirmation Check
      if (password !== confirmPassword) {
        showToast('Mật khẩu xác nhận không trùng khớp! Vui lòng kiểm tra lại.', 'warning');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Đang tạo tài khoản...';

      try {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;

        showToast('Đăng ký thành công! Đăng nhập ngay.', 'success');
        // Switch to login tab and prefill email
        document.getElementById('login-email').value = email;
        tabLoginBtn.click();
      } catch (err) {
        showToast('Đăng ký thất bại: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Đăng Ký Tài Khoản';
      }
    };
  </script>

</body>
</html>
